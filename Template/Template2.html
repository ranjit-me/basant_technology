<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starlit Love Journey</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap");

      body {
        margin: 0;
        overflow: hidden;
        background-color: #050510;
        font-family: "Montserrat", sans-serif;
      }
      .font-cinzel {
        font-family: "Cinzel", serif;
      }

      /* Custom Scrollbar for Modal */
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }

      /* Heart Animation */
      @keyframes floatUp {
        0% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(-100px) scale(0);
          opacity: 0;
        }
      }
      .floating-heart {
        position: absolute;
        animation: floatUp 1.5s ease-out forwards;
        pointer-events: none;
        color: #ec4899;
      }

      /* Fade In Animation */
      .fade-in {
        animation: fadeIn 1s ease-in forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // --- DATA: Shared Memories (Customize these!) ---
      const MEMORIES = [
        {
          id: 1,
          title: "Our First Encounter",
          date: "Feb 14, 2021",
          text: "The moment our eyes met across the coffee shop. The universe shifted.",
          color: 0xffaaee,
          pos: [10, 5, -10],
        },
        {
          id: 2,
          title: "Starry Night Drive",
          date: "June 20, 2021",
          text: "We drove until the city lights faded and watched the Milky Way.",
          color: 0xaaddff,
          pos: [-15, 8, -20],
        },
        {
          id: 3,
          title: "The Big 'Yes'",
          date: "Dec 31, 2022",
          text: "Under fireworks and falling snow, we promised forever.",
          color: 0xffddaa,
          pos: [0, -5, -15],
        },
        {
          id: 4,
          title: "Our First Home",
          date: "Aug 15, 2023",
          text: "Boxes everywhere, pizza on the floor, and so much happiness.",
          color: 0xaaffaa,
          pos: [12, -8, -25],
        },
        {
          id: 5,
          title: "Future Dreams",
          date: "Forever",
          text: "To all the galaxies we have yet to explore together.",
          color: 0xffffff,
          pos: [-8, 0, -8],
        },
      ];

      // --- AUDIO ENGINE: Web Audio API (No mp3 files needed) ---
      class AudioEngine {
        constructor() {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.oscillators = [];
          this.gainNode = this.ctx.createGain();
          this.gainNode.connect(this.ctx.destination);
          this.gainNode.gain.value = 0; // Start muted
          this.isPlaying = false;
        }

        playAmbient() {
          if (this.isPlaying) return;
          this.ctx.resume();
          this.isPlaying = true;

          // Create a chord (Major 7th type pad)
          const freqs = [196.0, 246.94, 293.66, 349.23]; // G3, B3, D4, F4
          freqs.forEach((f) => {
            const osc = this.ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.value = f;
            const oscGain = this.ctx.createGain();
            oscGain.gain.value = 0.05; // Low volume for ambience
            osc.connect(oscGain);
            oscGain.connect(this.gainNode);
            osc.start();
            this.oscillators.push({ osc, oscGain });
          });

          // Fade in
          this.gainNode.gain.linearRampToValueAtTime(
            0.3,
            this.ctx.currentTime + 2
          );
        }

        playChime() {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, this.ctx.currentTime); // A5
          osc.frequency.exponentialRampToValueAtTime(
            1760,
            this.ctx.currentTime + 0.1
          );

          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.ctx.currentTime + 1
          );

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 1);
        }

        toggleMute() {
          if (!this.isPlaying) {
            this.playAmbient();
            return true;
          }
          const target = this.gainNode.gain.value > 0 ? 0 : 0.3;
          this.gainNode.gain.linearRampToValueAtTime(
            target,
            this.ctx.currentTime + 0.5
          );
          return target > 0;
        }
      }

      const audioManager = new AudioEngine();

      // --- UTILS: Generate Star Texture programmatically ---
      const createStarTexture = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext("2d");
        const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
        gradient.addColorStop(0, "rgba(255,255,255,1)");
        gradient.addColorStop(0.2, "rgba(255,255,255,0.8)");
        gradient.addColorStop(0.5, "rgba(255,255,255,0.2)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 32, 32);
        const texture = new THREE.Texture(canvas);
        texture.needsUpdate = true;
        return texture;
      };

      // --- COMPONENT: 3D Scene ---
      const ThreeScene = ({ onStarClick }) => {
        const mountRef = useRef(null);
        const sceneRef = useRef(null);
        const starsRef = useRef([]);

        useEffect(() => {
          // 1. Setup Scene
          const scene = new THREE.Scene();
          scene.fog = new THREE.FogExp2(0x050510, 0.03); // Deep space fog
          sceneRef.current = scene;

          const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
          );
          camera.position.z = 15;

          const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
          });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
          mountRef.current.appendChild(renderer.domElement);

          // 2. Add Background Particles
          const particleGeo = new THREE.BufferGeometry();
          const particleCount = 2000;
          const posArray = new Float32Array(particleCount * 3);

          for (let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
          }
          particleGeo.setAttribute(
            "position",
            new THREE.BufferAttribute(posArray, 3)
          );
          const particleMat = new THREE.PointsMaterial({
            size: 0.15,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8,
          });
          const particles = new THREE.Points(particleGeo, particleMat);
          scene.add(particles);

          // 3. Add Memory Stars (Interactive)
          const starTexture = createStarTexture();
          const raycaster = new THREE.Raycaster();
          const mouse = new THREE.Vector2();
          const memoryStars = [];

          MEMORIES.forEach((mem) => {
            const geometry = new THREE.SpriteMaterial({
              map: starTexture,
              color: mem.color,
              transparent: true,
              blending: THREE.AdditiveBlending,
            });
            const sprite = new THREE.Sprite(geometry);
            sprite.position.set(...mem.pos);
            sprite.scale.set(2, 2, 1);
            sprite.userData = { id: mem.id }; // Link ID to sprite

            // Add a subtle "glow" behind it
            const glowGeo = new THREE.SpriteMaterial({
              map: starTexture,
              color: mem.color,
              transparent: true,
              opacity: 0.3,
              blending: THREE.AdditiveBlending,
            });
            const glow = new THREE.Sprite(glowGeo);
            glow.scale.set(4, 4, 1);
            sprite.add(glow);

            scene.add(sprite);
            memoryStars.push(sprite);
          });
          starsRef.current = memoryStars;

          // 4. Animation Loop
          let frameId;
          const animate = () => {
            frameId = requestAnimationFrame(animate);

            // Rotate background slowly
            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0002;

            // Pulse memory stars
            const time = Date.now() * 0.001;
            memoryStars.forEach((star, index) => {
              const scale = 2 + Math.sin(time + index) * 0.3;
              star.scale.set(scale, scale, 1);
            });

            renderer.render(scene, camera);
          };
          animate();

          // 5. Interaction Handlers
          const handleResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          };

          const onMouseClick = (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(memoryStars);

            if (intersects.length > 0) {
              const id = intersects[0].object.userData.id;
              onStarClick(id);
              audioManager.playChime();
            }
          };

          // Mouse move for parallax effect
          const onMouseMove = (event) => {
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 5 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
          };

          window.addEventListener("resize", handleResize);
          window.addEventListener("click", onMouseClick);
          window.addEventListener("mousemove", onMouseMove);

          return () => {
            window.removeEventListener("resize", handleResize);
            window.removeEventListener("click", onMouseClick);
            window.removeEventListener("mousemove", onMouseMove);
            cancelAnimationFrame(frameId);
            if (mountRef.current)
              mountRef.current.removeChild(renderer.domElement);
          };
        }, []);

        return <div ref={mountRef} className="absolute inset-0 z-0" />;
      };

      // --- COMPONENT: Intro Screen ---
      const Intro = ({ onStart }) => (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black bg-opacity-90 text-white p-6 text-center fade-in">
          <h1 className="text-5xl md:text-7xl font-cinzel text-pink-300 mb-4 tracking-widest drop-shadow-[0_0_15px_rgba(236,72,153,0.8)]">
            Cosmic Love
          </h1>
          <p className="text-lg md:text-xl font-light text-blue-200 mb-8 max-w-lg">
            A journey through the stars of our shared memories. Put on your
            headphones for the best experience.
          </p>
          <button
            onClick={onStart}
            className="px-8 py-3 bg-transparent border border-pink-400 text-pink-300 hover:bg-pink-500 hover:text-white rounded-full transition-all duration-300 transform hover:scale-105 uppercase tracking-widest"
          >
            Enter the Galaxy
          </button>
        </div>
      );

      // --- COMPONENT: Memory Modal ---
      const MemoryModal = ({ memory, onClose }) => {
        if (!memory) return null;

        return (
          <div
            className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm fade-in"
            onClick={onClose}
          >
            <div
              className="bg-gray-900 border border-purple-500/30 p-8 rounded-2xl max-w-md w-full relative shadow-[0_0_50px_rgba(168,85,247,0.2)] transform transition-all"
              onClick={(e) => e.stopPropagation()}
            >
              <button
                onClick={onClose}
                className="absolute top-4 right-4 text-gray-400 hover:text-white"
              >
                <i data-lucide="x" className="w-6 h-6"></i>
              </button>

              <div className="text-purple-300 text-sm font-semibold tracking-wider mb-2 uppercase">
                {memory.date}
              </div>
              <h2 className="text-3xl font-cinzel text-white mb-4">
                {memory.title}
              </h2>
              <div className="h-px w-20 bg-gradient-to-r from-pink-500 to-transparent mb-6"></div>
              <p className="text-gray-300 leading-relaxed font-light text-lg">
                {memory.text}
              </p>

              <div className="mt-8 flex justify-center">
                <span className="text-pink-400 animate-pulse text-2xl">♥</span>
              </div>
            </div>
          </div>
        );
      };

      // --- MAIN APP COMPONENT ---
      const App = () => {
        const [started, setStarted] = useState(false);
        const [activeMemory, setActiveMemory] = useState(null);
        const [loveCount, setLoveCount] = useState(0);
        const [isMuted, setIsMuted] = useState(true);
        const [hearts, setHearts] = useState([]);

        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [started, activeMemory]);

        const handleStart = () => {
          setStarted(true);
          const playing = audioManager.toggleMute(); // Try to play audio on user interaction
          setIsMuted(!playing);
        };

        const toggleAudio = () => {
          const playing = audioManager.toggleMute();
          setIsMuted(!playing);
        };

        const handleStarClick = (id) => {
          const mem = MEMORIES.find((m) => m.id === id);
          setActiveMemory(mem);
        };

        const sendLove = (e) => {
          setLoveCount((c) => c + 1);

          // Add floating heart
          const id = Date.now();
          const rect = e.target.getBoundingClientRect();
          const randomX = (Math.random() - 0.5) * 40;

          setHearts((prev) => [
            ...prev,
            { id, x: rect.left + rect.width / 2 + randomX, y: rect.top },
          ]);

          // Remove heart after animation
          setTimeout(() => {
            setHearts((prev) => prev.filter((h) => h.id !== id));
          }, 1500);

          // Play faint chime if audio is on
          if (!isMuted) audioManager.playChime();
        };

        return (
          <div className="relative w-full h-screen text-white overflow-hidden select-none">
            {/* 3D Background */}
            <ThreeScene onStarClick={handleStarClick} />

            {!started && <Intro onStart={handleStart} />}

            {started && (
              <>
                {/* HUD Header */}
                <div className="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-10 pointer-events-none">
                  <div>
                    <h3 className="text-xl font-cinzel tracking-widest text-white drop-shadow-md">
                      Starlit Journey
                    </h3>
                    <p className="text-xs text-blue-200">
                      Explore the constellation of us
                    </p>
                  </div>
                  <div className="pointer-events-auto flex gap-4">
                    <button
                      onClick={toggleAudio}
                      className="p-2 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur transition-colors"
                    >
                      <i
                        data-lucide={isMuted ? "volume-x" : "music"}
                        className="w-5 h-5 text-pink-200"
                      ></i>
                    </button>
                  </div>
                </div>

                {/* Floating Hearts Container */}
                {hearts.map((h) => (
                  <div
                    key={h.id}
                    className="floating-heart"
                    style={{ left: h.x, top: h.y, fontSize: "24px" }}
                  >
                    ❤
                  </div>
                ))}

                {/* Bottom Controls */}
                <div className="absolute bottom-8 left-0 w-full flex flex-col items-center justify-center z-10 pointer-events-none">
                  <div className="pointer-events-auto flex flex-col items-center gap-3">
                    <div className="text-pink-300 font-cinzel text-sm tracking-widest">
                      Love Level: {loveCount}%
                    </div>
                    <button
                      onClick={sendLove}
                      className="group relative px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 rounded-full text-white font-semibold shadow-lg shadow-pink-500/30 hover:shadow-pink-500/50 transition-all transform active:scale-95 flex items-center gap-2"
                    >
                      <i
                        data-lucide="heart"
                        className="w-4 h-4 fill-current group-hover:animate-ping"
                      ></i>
                      <span>Send Love</span>
                    </button>
                  </div>
                  <div className="mt-4 text-white/30 text-[10px] uppercase tracking-[0.2em]">
                    Click the glowing stars
                  </div>
                </div>

                {/* Memory Modal */}
                <MemoryModal
                  memory={activeMemory}
                  onClose={() => setActiveMemory(null)}
                />
              </>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
