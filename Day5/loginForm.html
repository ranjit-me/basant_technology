<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
      }
      .loginForm {
        border-radius: 15px;
        border: solid black;
        /* background-color: cornsilk; */
        align-items: center;
        margin-right: 1000px;
      }
      .login {
        margin-top: 40px;
        margin-left: 40px;
        height: 50px;
        /* margin-bottom: 40px; */
        background-color: coral;
        border-radius: 16px;
        color: black;
        font-size: 20px;
        border: none;
        width: 110px;
        text-align: center;
      }
      .username {
        align-items: center;
        text-align: center;
      }
      .password {
        text-align: center;
      }
      .login:hover {
        background-color: white;
        border: solid black;
      }
      h1 {
        font-family: Arial, Helvetica, sans-serif;
      }
      a {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="loginForm">
      <h1>Login Form</h1>
      <div class="username">
        <label for="username">User Name</label>
        <br />
        <input type="text" placeholder="enter username" />
      </div>
      <div class="password">
        <br />
        <label for="password">Password</label>
        <br />
        <input type="password" placeholder="enter password" />
      </div>

      <button class="login">Login</button>
      <a href="" style="">Register</a>
    </div>
  </body>
</html>
