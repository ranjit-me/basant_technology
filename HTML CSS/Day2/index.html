<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        background-color: bisque;
        /* text-align: center; */
        font-size: xx-large;
        color: black;
      }
      * {
        color: black;
      }
      h1 {
        color: red;
      }
      .heading {
        color: blueviolet;
      }
      #heading {
        color: blue;
      }
      h1,
      h2 {
        color: rgb(100, 100, 100);
      }
    </style>
  </head>
  <body>
    <h1>Element Style</h1>
    <h1 class="heading">Class Style</h1>
    <h1 id="heading">Id styling</h1>
    <h2>Group Selector</h2>
  </body>
</html>
