<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .one {
        height: 400px;
        width: 400px;
        background-color: rgb(171, 144, 235);
        animation-name: myDev;
        animation-duration: 120s;
        position: relative;
      }
      @keyframes myDev {
        /* from {
          background-color: red;
        }
        to {
          background-color: aqua;
        } */
        0% {
          background-color: red;
          left: 0px;
          top: 0px;
        }
        25% {
          background-color: aqua;
          left: 400px;
          top: 0px;
        }
        50% {
          background-color: burlywood;
          left: 400px;
          top: 400px;
        }
        70% {
          background-color: coral;
          left: 0px;
          top: 400px;
        }
        100% {
          background-color: chartreuse;
          left: 0px;
          top: 0px;
        }
      }
      /* .one:hover {
        width: 600px;
      } */
    </style>
  </head>
  <body>
    <div class="one">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo aspernatur
      sapiente officiis minus blanditiis, numquam, dolorem earum sequi iure
      commodi fugiat odio quaerat repudiandae. Voluptate dolore blanditiis nisi
      minima quam.
    </div>
  </body>
</html>
